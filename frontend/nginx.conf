server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    default_type text/html;

    access_log /dev/stdout;
    error_log  /dev/stderr;

    # ─── Cache: no-store para iteraciones rápidas en dev ────────────────
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;

    # ─── Security headers (M2 + H4) ─────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP relajado para prototipo (necesita Babel unsafe-eval + unpkg CDN)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https: http://localhost:3003 http://cdpro-backend:8000; media-src 'self' data: blob: https: http://localhost:3003 http://cdpro-backend:8000; connect-src 'self' https: http://localhost:3003 http://cdpro-backend:8000; frame-ancestors 'self';" always;

    # ─── CORS estricto (C4) — solo orígenes del sandbox ─────────────────
    set $cors_origin "";
    if ($http_origin = "http://localhost:1004") { set $cors_origin $http_origin; }
    if ($http_origin = "http://localhost:2002") { set $cors_origin $http_origin; }
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Vary "Origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # JSX como text/babel
    location ~ \.jsx$ {
        add_header Content-Type "text/babel; charset=utf-8" always;
        add_header Cache-Control "no-store" always;
    }

    # SVG MIME explícito (evita download de logos)
    location ~ \.svg$ {
        add_header Content-Type "image/svg+xml" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }
}
