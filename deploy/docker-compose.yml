# ══════════════════════════════════════════════════════════════════════════
#  Cliender Design Pro — local stack
#  ----------------------------------------------------------------------
#  Services:
#    cdpro-backend     :3003 (host) -> :8000 (container)  FastAPI + LangGraph
#    cdpro-prototype   :2002 (host) -> :80   (container)  nginx static HTML
#    cdpro-remotion    :4010 (host) -> :4000 (container)  Remotion render
#
#  Copy ../.env.example to .env and fill in your keys before running.
# ══════════════════════════════════════════════════════════════════════════

name: cdpro

# Defaults applied to ALL services (log rotation + init + restart)
x-base: &cdpro-base
  init: true
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:

  # ── Backend FastAPI + LangGraph (Claude + KIE.ai) ──────────────────────
  cdpro-backend:
    <<: *cdpro-base
    container_name: cdpro-backend
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: cdpro/backend:0.1.0
    env_file:
      - .env
    ports:
      - "3003:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      CORS_ORIGINS: ${CORS_ORIGINS:-'["http://localhost:2002","http://127.0.0.1:2002"]'}
      # Secrets (ANTHROPIC_API_KEY, KID_AI_API_KEY, SUPABASE_URL,
      # SUPABASE_SERVICE_KEY) come from env_file: .env
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-5}
      CLAUDE_MAX_TOKENS: ${CLAUDE_MAX_TOKENS:-4096}
      KID_AI_BASE_URL: ${KID_AI_BASE_URL:-https://api.kid.ai/v1}
      CRITIC_MAX_RETRIES: ${CRITIC_MAX_RETRIES:-2}
      ANALYTICS_DAILY_LIMIT_USD: ${ANALYTICS_DAILY_LIMIT_USD:-10}
      REMOTION_URL: ${REMOTION_URL:-http://cdpro-remotion:4000}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3); sys.exit(0)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - cdpro-net
    security_opt:
      - no-new-privileges:true

  # ── HTML prototype (nginx) — instant functional UI ────────────────────
  cdpro-prototype:
    <<: *cdpro-base
    container_name: cdpro-prototype
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: cdpro/prototype:0.1.0
    ports:
      - "2002:80"
    depends_on:
      cdpro-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cdpro-net
    security_opt:
      - no-new-privileges:true

  # ── Remotion render service (Node + Chromium) — video assembly ─────────
  cdpro-remotion:
    <<: *cdpro-base
    container_name: cdpro-remotion
    build:
      context: ../remotion
      dockerfile: Dockerfile
    image: cdpro/remotion:0.1.0
    env_file:
      - .env
    ports:
      - "4010:4000"
    environment:
      PORT: "4000"
      # SUPABASE_URL + SUPABASE_SERVICE_KEY come from .env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - cdpro-net
    security_opt:
      - no-new-privileges:true

networks:
  cdpro-net:
    name: cdpro-net
    driver: bridge
